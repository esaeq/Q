<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的第一個 GitHub 網站</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      line-height: 1.6;
    }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>網站上線成功</h1>
  <p>這個頁面是由 GitHub Pages 託管的。</p>
  <button id="btn">點我測試互動</button>
  <p id="msg"></p>

  <script>
    document.getElementById("btn").addEventListener("click", () => {
      document.getElementById("msg").textContent = "JavaScript 運作正常！";
    });
  </script>
</body>
</html>
